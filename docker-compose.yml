# Backend + PostgreSQL. Uso:  docker compose up --build
# Luego, para cargar datos de prueba:  docker compose exec api python -m app.seed
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: laboratorio
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:-lab_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d laboratorio"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      LAB_ENTORNO: ${LAB_ENTORNO:-desarrollo}
      LAB_DATABASE_URL: postgresql+psycopg://lab:${LAB_DB_PASSWORD:-lab_dev}@db:5432/laboratorio
      LAB_JWT_SECRETO: ${LAB_JWT_SECRETO:-solo-para-desarrollo-cambiar-antes-de-desplegar}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
